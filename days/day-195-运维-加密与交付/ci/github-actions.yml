# 这是"仓库里应该长什么样"的 GitHub Actions 工作流样例。
# 本课程环境没有在 GitHub 上真正触发过它（见 README 的诚实说明），
# 但每一步都和 ci/run-local.sh 完全对应，本地跑通即等价验证了逻辑。
name: ci

on:
  push:
    paths:
      - "days/day-195-运维-加密与交付/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r "days/day-195-运维-加密与交付/code/requirements.txt"
      - name: 语法检查
        run: python -m compileall -q "days/day-195-运维-加密与交付/code"
      - name: 离线自检
        working-directory: days/day-195-运维-加密与交付
        run: |
          for f in code/ops_lib.py code/crypto_lib.py code/01-retry-backoff.py \
                   code/02-crypto-envelope.py code/03-api-auth.py \
                   code/04-logging-alert.py code/app.py; do
            python "$f" --self-test
          done
      - name: 构建镜像
        run: docker build -t learn195-app:ci "days/day-195-运维-加密与交付/code"
