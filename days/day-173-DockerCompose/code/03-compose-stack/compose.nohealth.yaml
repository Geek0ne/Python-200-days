# 覆盖文件：把 app/worker/nginx 的依赖降级为"仅等容器启动"
# 用法：docker compose -f compose.yaml -f compose.nohealth.yaml up -d
services:
  app:
    depends_on:
      redis:    {condition: service_started}
      postgres: {condition: service_started}
  worker:
    depends_on:
      postgres: {condition: service_started}
  nginx:
    depends_on:
      app: {condition: service_started}