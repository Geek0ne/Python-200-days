name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        py: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: pip install -r requirements.txt
      - run: pytest -q --cov=src --cov-report=term

  package:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Verify wheel
        run: |
          ls -l dist/
          pip install dist/*.whl
          python -c "from src.calc import add; print('wheel ok:', add(2, 3))"
      - uses: actions/upload-artifact@v4
        # act 本地运行没有 artifact 后端（无 ACTIONS_RUNTIME_TOKEN），仅在真实 runner 上上传
        if: env.ACTIONS_RUNTIME_TOKEN != ''
        with:
          name: dist
          path: dist/

# 说明（Day 174 真机验证后的最终形态）：
#  1. 每个需要 pip 的 job 都必须有 actions/setup-python，
#     否则落到 runner 系统 Python 上，Ubuntu 24.04 的 PEP 668 会直接拒绝安装
#  2. 覆盖率必须装 pytest-cov（--cov 参数由它提供，coverage 本身不提供）
#  3. import 自家包前，src 必须有 __init__.py，否则 rootdir 不在 sys.path
#  4. python -m build 需要 pyproject.toml 或 setup.py
#  5. if 条件用的是真实分支名（refs/heads/main），本地默认分支叫 master 会静默跳过
