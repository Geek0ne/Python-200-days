server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:8000;         # 服务名解析由 Compose 内置 DNS 完成
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /via-nginx {
        return 200 "day173 nginx ok\n";
    }
}