name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 语法检查（含 SyntaxWarning）
        run: python -W error::SyntaxWarning -m compileall -q days site

      - name: 构建学习站点
        run: |
          python -m pip install --quiet markdown pygments
          python site/build.py
