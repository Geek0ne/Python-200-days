name: Deploy Pages

# push 到 main 后自动重建静态站并发布到 gh-pages 分支，
# 从此改完内容/站点代码 push 即生效，无需手动跑 site/build.py。
# 依赖 GitHub Pages 设置保持 "Deploy from a branch: gh-pages / root"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建学习站点
        run: |
          python -m pip install --quiet markdown pygments
          python site/build.py

      - name: 发布到 gh-pages
        run: |
          cd site/dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
