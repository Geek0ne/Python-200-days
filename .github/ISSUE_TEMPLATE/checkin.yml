name: "📅 Day N 打卡"
description: 记录今天的学习进度，坚持打卡
title: "[打卡] Day "
labels: ["打卡"]
body:
  - type: input
    id: day
    attributes:
      label: Day 编号
      placeholder: "例如：Day 042"
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 今天完成了什么
      description: 学了哪些知识点、跑了哪些代码
    validations:
      required: true

  - type: textarea
    id: problems
    attributes:
      label: 遇到的问题 / 疑问
      description: 没解决也没关系，记录下来一起讨论

  - type: input
    id: time
    attributes:
      label: 用时（可选）
      placeholder: "例如：2 小时"
